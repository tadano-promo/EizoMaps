<link rel="preconnect" href="https://fonts.googleapis.com">

<script src="/assets/js/config.js" defer></script>
<script src="/assets/js/app.js" defer></script>

<body>
<main class="section section--profile">
  <div class="wrap">
    <div class="notice" id="pageMsg" hidden></div>
    <div id="profile"></div>
    <section id="portfolioSection" hidden>
      <h2 class="works-title">作品</h2>
      <div class="work-tabs" id="workTabs" hidden></div>
      <div class="grid works-grid" id="portfolioGrid"></div>
    </section>
    <section id="packageSection" hidden>
      <hr class="divider">
      <p class="eyebrow">Price</p>
      <h2>料金の目安</h2>
      <div class="grid grid--3" id="packageGrid"></div>
      <p class="small muted">金額は税込です。内容によって変わるので、正式な金額はお見積もりでお伝えします。</p>
    </section>
    <section id="profileMore" hidden></section>
    <section id="reviewSection" hidden>
      <hr class="divider">
      <p class="eyebrow">Reviews</p>
      <h2>評価</h2>
      <p class="small muted review-note"><strong>評価は誰でも見られます。</strong>評価を書けるのは、実際にこのクリエイターに依頼し、取引が完了した人だけです。投稿者の名前は表示されません。Eizo Maps の外での取引は自己申告となり、運営が確認してから公開します。</p>
      <div id="reviewList"></div>
      <div id="reviewWrite"></div>
    </section>
  </div>
</main>
</body>
