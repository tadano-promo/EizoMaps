<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self' https://www.googletagmanager.com https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://img.youtube.com https://i.ytimg.com https://i.vimeocdn.com https://*.supabase.co https://*.google-analytics.com https://*.googletagmanager.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://vimeo.com https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://www.google.com; frame-src https://www.youtube.com https://player.vimeo.com; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>映像制作の予算の目安 — Eizo Maps</title>
<meta name="description" content="動画の種類・長さ・撮影の有無などを選ぶだけで、映像制作の予算の目安が分かります。登録なしで使えます。">
<link rel="canonical" href="https://eizo-maps.com/estimate/quick/">
<meta property="og:site_name" content="Eizo Maps">
<meta property="og:title" content="映像制作の予算の目安 — Eizo Maps">
<meta property="og:description" content="動画の種類・長さ・撮影の有無などを選ぶだけで、映像制作の予算の目安が分かります。登録なしで使えます。">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=DM+Mono:wght@400;500&amp;family=Noto+Sans+JP:wght@300;400;500;700&amp;display=swap">
<link rel="stylesheet" href="/assets/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js" integrity="sha384-iLddHTLokph6Omwoyid4XKxHaWa6w41BnoEj0q5oOrzmYPpHIKt1wyjReA7s//pP" crossorigin="anonymous" referrerpolicy="no-referrer" defer></script>
<script src="/assets/js/config.js" defer></script>
<script src="/assets/js/app.js" defer></script>
<script src="/assets/js/page-estimate-quick.js" defer></script>
</head>
<body>
<main class="section">
  <div class="wrap">
    <p class="eyebrow eyebrow--client">Budget</p>
    <h1>映像制作の予算の目安</h1>
    <p class="muted">選ぶだけで、だいたいの予算が分かります。実際の金額は、頼むクリエイターの見積もりで決まります。</p>
    <form id="qForm" class="stack" novalidate>
      <div class="row">
        <label class="field"><span class="label">何の動画？</span><select id="qType"></select></label>
        <label class="field"><span class="label">長さ</span><select id="qLen"></select></label>
      </div>
      <div class="row">
        <label class="field"><span class="label">本数</span><select id="qCount"></select></label>
        <label class="field"><span class="label">撮影</span><select id="qShoot"></select></label>
      </div>
      <div class="row">
        <label class="field"><span class="label">出る人</span><select id="qCast"></select></label>
        <label class="field"><span class="label">撮る場所</span><select id="qPlace"></select></label>
      </div>
      <fieldset class="field q-opts"><legend class="label">あれば選ぶ</legend>
        <label><input type="checkbox" id="qNarr"> ナレーション</label>
        <label><input type="checkbox" id="qMusic"> オリジナルの音楽</label>
        <label><input type="checkbox" id="qCg"> CG・アニメーション</label>
        <label><input type="checkbox" id="qRush"> 急ぎ（2週間以内）</label>
      </fieldset>
    </form>
    <section class="card q-result" id="qResult" aria-live="polite"></section>
  </div>
</main>
</body>
</html>
