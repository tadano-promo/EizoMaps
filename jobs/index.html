<body>
<main class="section">
  <div class="wrap">
    <div class="page-head">
      <div>
        <p class="eyebrow">Jobs</p>
        <h1>映像制作の募集</h1>
      </div>
      <a class="btn btn--sm btn--primary page-head__add" id="newPostBtn" href="/jobs/new.html">＋ 募集を出す</a>
    </div>
    <p class="muted">クライアントさんが出した、映像制作の仕事の募集です。気になる募集には、クリエイターから提案を送れます。依頼した人の名前は、提案が選ばれたときにわかります。</p>
    <div class="notice" id="pageMsg" hidden></div>
    <div class="jobs-filter">
      <select id="fGenre" aria-label="職種"><option value="">職種（すべて）</option></select>
      <select id="fArea" aria-label="地域"><option value="">地域（すべて）</option></select>
      <label class="small jobs-filter__check"><input type="checkbox" id="fRemote"> 遠方OK・オンラインのみ</label>
    </div>
    <p class="small muted" id="jobsCount"></p>
    <div class="stack" id="jobsList"><p class="small muted">読み込み中…</p></div>
    <p class="small"><a href="/jobs/mine.html" id="mineLink" hidden>自分の募集・提案を見る →</a></p>
  </div>
