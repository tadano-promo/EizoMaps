<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self' https://www.googletagmanager.com https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://img.youtube.com https://i.ytimg.com https://i.vimeocdn.com https://*.supabase.co https://*.google-analytics.com https://*.googletagmanager.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://vimeo.com https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://www.google.com; frame-src https://www.youtube.com https://player.vimeo.com; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>募集を出す — Eizo Maps</title>
<meta name="description" content="映像制作の仕事の募集を出します。">
<meta name="robots" content="noindex, nofollow">
<meta property="og:site_name" content="Eizo Maps">
<meta property="og:title" content="募集を出す — Eizo Maps">
<meta property="og:description" content="映像制作の仕事の募集を出します。">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=DM+Mono:wght@400;500&amp;family=Noto+Sans+JP:wght@300;400;500;700&amp;display=swap">
<link rel="stylesheet" href="/assets/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js" integrity="sha384-iLddHTLokph6Omwoyid4XKxHaWa6w41BnoEj0q5oOrzmYPpHIKt1wyjReA7s//pP" crossorigin="anonymous" referrerpolicy="no-referrer" defer></script>
<script src="/assets/js/config.js" defer></script>
<script src="/assets/js/app.js" defer></script>
<script src="/assets/js/jobs.js" defer></script>
<script src="/assets/js/page-job-new.js" defer></script>
</head>
<body>
<main class="section">
  <div class="wrap">
    <p class="eyebrow eyebrow--client">New job</p>
    <h1>募集を出す</h1>
    <p class="muted">だれに頼めばいいか決まっていないときは、募集を出してください。気づいたクリエイターから、金額・納期・ひとことの「提案」が届きます。その中から1人を選ぶと、案件が始まる準備ができます。掲載は無料です。</p>
    <div class="notice" id="pageMsg" hidden></div>
    <form id="postForm" class="stack" novalidate>
      <section id="clientBox" class="stack" hidden>
        <h2>依頼元の情報</h2>
        <p class="small muted">はじめてのときだけ入れてください。一覧にはお名前は出ません（提案を選んだ相手にだけ伝わります）。</p>
        <label class="field"><span class="label">お名前・担当者名 <span class="muted">（必須）</span></span><input type="text" id="clName" maxlength="40"></label>
        <label class="field"><span class="label">会社名・お店の名前</span><input type="text" id="clCompany" maxlength="80"></label>
        <hr class="divider">
      </section>
      <label class="field"><span class="label">募集のタイトル <span class="muted">（必須・100文字まで）</span></span>
        <input type="text" id="title" maxlength="100" placeholder="例：カフェの新メニュー紹介 縦型動画3本"></label>
      <label class="field"><span class="label">内容 <span class="muted">（必須・10〜4000文字）</span></span>
        <textarea id="description" maxlength="4000" rows="8" placeholder="例：Instagram のリールに載せる15秒の縦型動画を3本。撮影は店内で半日、出演はスタッフ。BGMと字幕まで入れてほしいです。"></textarea></label>
      <div class="row">
        <label class="field"><span class="label">案件の種類</span><select id="kind"><option value="">選ばない</option></select></label>
        <label class="field"><span class="label">予算</span><select id="budget"></select></label>
      </div>
      <div class="field">
        <span class="label">頼みたい職種 <span class="muted">（5つまで・選ばなくてもOK）</span></span>
        <div id="genrePick"></div>
      </div>
      <div class="row">
        <label class="field"><span class="label">地域（撮影の場所など）</span><select id="area"><option value="">決まっていない・どこでも</option></select></label>
        <label class="field jobs-check"><span class="label">遠くの人</span><span><input type="checkbox" id="remoteOk"> 遠方・オンラインだけの人もOK</span></label>
      </div>
      <div class="row">
        <label class="field"><span class="label">募集の締め切り <span class="muted">（必須・60日後まで）</span></span><input type="date" id="closesOn"></label>
        <label class="field"><span class="label">希望納期</span><input type="date" id="dueOn"></label>
      </div>
      <div data-deal-rules="クリエイターと条件が決まったら、この決まりを読んで同意してから仕事を始めます。先に目を通しておいてください。"></div>
      <div class="form-actions">
        <button class="btn btn--primary" type="submit" id="submitBtn">この内容で募集を出す</button>
      </div>
    </form>
  </div>
</main>
</body>
</html>
