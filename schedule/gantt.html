<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://img.youtube.com https://i.ytimg.com https://i.vimeocdn.com https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://vimeo.com; frame-src 'none'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>ガントチャート — Eizo Maps</title>
<meta name="description" content="案件ごとの期間と締め切りを、横に並べて見る。">
<meta name="robots" content="noindex, nofollow">
<meta property="og:site_name" content="Eizo Maps">
<meta property="og:title" content="ガントチャート — Eizo Maps">
<meta property="og:description" content="案件ごとの期間と締め切りを、横に並べて見る。">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=DM+Mono:wght@400;500&amp;family=Noto+Sans+JP:wght@300;400;500;700&amp;display=swap">
<link rel="stylesheet" href="/assets/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js" integrity="sha384-iLddHTLokph6Omwoyid4XKxHaWa6w41BnoEj0q5oOrzmYPpHIKt1wyjReA7s//pP" crossorigin="anonymous" referrerpolicy="no-referrer" defer></script>
<script src="/assets/js/config.js" defer></script>
<script src="/assets/js/app.js" defer></script>
<script src="/assets/js/page-schedule-gantt.js" defer></script>
</head>
<body>
<main class="section">
  <div class="wrap">
    <p class="eyebrow">Gantt chart</p>
    <h1>ガントチャート</h1>
    <p class="muted small">案件ごとの期間を横の棒で、納品や締め切りを ◆ で並べて見られます。同じ時期に重なっている案件がひと目で分かります。</p>
    <div class="notice" id="pageMsg" hidden></div>

    <section id="ganttBody" hidden>
      <div class="vcal-bar gantt-bar">
        <div class="vcal-nav">
          <button class="btn btn--sm" type="button" id="gPrev" aria-label="前へ">←</button>
          <span class="gantt-range mono" id="gRange"></span>
          <button class="btn btn--sm" type="button" id="gNext" aria-label="次へ">→</button>
          <button class="btn btn--sm" type="button" id="gToday">今日</button>
        </div>
        <div class="vcal-nav gantt-opts">
          <label class="checkbox small"><input type="checkbox" id="gShowDone"> <span>終わった案件も出す</span></label>
          <select id="gWeeks" aria-label="表示する期間">
            <option value="4">4週間</option>
            <option value="8" selected>8週間</option>
            <option value="13">3か月</option>
            <option value="26">半年</option>
          </select>
          <button class="btn btn--sm" type="button" id="gOpenAll">すべて開く</button>
          <button class="btn btn--sm" type="button" id="gCloseAll">すべて閉じる</button>
        </div>
      </div>

      <div class="gantt-scroll" id="gScroll">
        <div class="gantt" id="gantt"></div>
      </div>
      <div class="vcal-legend chips" id="gLegend"></div>
      <nav class="page-links small">
        <a href="/schedule/">← 月の表示</a>
        <a href="/schedule/day.html">今日の時間割</a>
        <a href="/schedule/projects.html">案件と共有リンク</a>
      </nav>
    </section>
  </div>
</main>
</body>
</html>
