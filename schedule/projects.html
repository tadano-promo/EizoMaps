<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://img.youtube.com https://i.ytimg.com https://i.vimeocdn.com https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://vimeo.com; frame-src 'none'; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>案件と共有リンク — Eizo Maps</title>
<meta name="description" content="自分で作った案件と、チームやクライアントに予定を見せる共有リンクの管理。">
<meta name="robots" content="noindex, nofollow">
<meta property="og:site_name" content="Eizo Maps">
<meta property="og:title" content="案件と共有リンク — Eizo Maps">
<meta property="og:description" content="自分で作った案件と、チームやクライアントに予定を見せる共有リンクの管理。">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=DM+Mono:wght@400;500&amp;family=Noto+Sans+JP:wght@300;400;500;700&amp;display=swap">
<link rel="stylesheet" href="/assets/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js" integrity="sha384-iLddHTLokph6Omwoyid4XKxHaWa6w41BnoEj0q5oOrzmYPpHIKt1wyjReA7s//pP" crossorigin="anonymous" referrerpolicy="no-referrer" defer></script>
<script src="/assets/js/config.js" defer></script>
<script src="/assets/js/app.js" defer></script>
<script src="/assets/js/page-schedule-projects.js" defer></script>
</head>
<body>
<main class="section">
  <div class="wrap">
    <p class="eyebrow"><a href="/schedule/" class="plain-link">Schedule</a> ／ Projects</p>
    <div class="page-head">
      <h1>案件と共有リンク</h1>
      <button class="btn btn--sm btn--primary page-head__add" type="button" id="projAddBtn" aria-controls="projNewCard" aria-expanded="false">＋ 案件を作る</button>
    </div>
    <p class="small muted">案件ごとに、チーム・クライアントさん・代理店さんへ予定を見せるリンクを作れます。相手は Eizo Maps に登録しなくても、リンクとパスワードで見られます。見るだけで、書き込みはできません。</p>
    <div class="notice" id="pageMsg" hidden></div>

    <section id="projBody" hidden>
      <div class="card stack add-panel" id="projNewCard" hidden>
        <label class="field">
          <span class="label">案件の名前 <span class="muted">（60文字まで）</span></span>
          <input type="text" id="newProjName" maxlength="60" placeholder="例：◯◯CM">
        </label>
        <div class="form-actions">
          <button class="btn btn--primary" type="button" id="newProjBtn">作る</button>
        </div>
        <p class="small muted">予定を入れるときに「案件」で選ぶと、その案件の予定になります（スケジュールの「予定を追加」から）。</p>
      </div>

      <p class="small muted" id="projEmpty" hidden>まだ案件がありません。右上の「＋ 案件を作る」から作れます。</p>
      <div class="stack" id="projList"></div>
    </section>
  </div>
</main>
</body>
</html>
