# GitHub Pages へのデプロイ
# main ブランチに push すると、リポジトリのルートをそのまま公開します。
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 評価やプロフィールの変更を、検索エンジン・AI 向けのページにも反映するため、1時間ごとに作り直す
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # 公開前に、管理者用の鍵が紛れ込んでいないか確認する。
      # 「service_role」という単語はコメントや手順書にも出てくるため、
      # 単語ではなく「鍵そのものの形」を見て判定する。
      #   - sb_secret_... 形式のシークレットキー
      #   - JWT 形式の鍵のうち、中身の role が service_role のもの
      # （anon / publishable キーは公開前提なので、見つかっても止めない）
      - name: Secret scan
        run: |
          set -uo pipefail
          fail=0

          if grep -rIn --exclude-dir=.git --exclude-dir=.github -E 'sb_secret_[A-Za-z0-9]' . ; then
            echo '::error::シークレットキー（sb_secret_...）が見つかりました。公開を中止します。'
            fail=1
          fi

          for tok in $(grep -rhoIE 'eyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}' \
                        --exclude-dir=.git --exclude-dir=.github . | sort -u); do
            payload=$(printf '%s' "$tok" | cut -d. -f2 | tr '_-' '/+')
            case $(( ${#payload} % 4 )) in
              2) payload="${payload}==" ;;
              3) payload="${payload}=" ;;
            esac
            role=$(printf '%s' "$payload" | base64 -d 2>/dev/null | tr -d ' ' | grep -o '"role":"[^"]*"' || true)
            echo "検出した鍵の role: ${role:-(判定不可)}"
            case "$role" in
              *service_role*)
                echo '::error::service_role キーがリポジトリに含まれています。公開を中止します。'
                fail=1
                ;;
            esac
          done

          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo 'OK: 管理者用の鍵は含まれていません'

      # 公開中のクリエイターごとに、評価・コメント・作品を書き込んだページ（/@ハンドル）を作り、
      # サイトの地図にも足す。データが取れないときはここで止まり、前回の公開がそのまま残る。
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Prerender creator pages
        run: node .github/prerender/prerender.mjs .

      # 更新したのに古い画面が出続けないよう、
      # 各ページが読み込む JS / CSS の後ろに「版の印（?v=コミット番号）」を付ける。
      # 印が変わるとブラウザは新しいファイルを取りに行く。
      - name: Cache busting
        run: |
          set -euo pipefail
          v="${GITHUB_SHA::8}"
          find . -name '*.html' -not -path './.git/*' -print0 \
            | xargs -0 sed -i -E "s#((src|href)=\"/assets/(js|css)/[^\"?]+\.(js|css))(\?v=[^\"]*)?\"#\1?v=${v}\"#g"
          grep -rhoE '/assets/js/app\.js\?v=[^"]+' --include=*.html . | head -1

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      # 公開（2026-11-29）：上げた直後は GitHub 側でファイルが見つからず失敗することがある（11/13〜11/27 の失敗6回はすべてこれ）。
      # 失敗するたびに「失敗しました」のメールが届くので、待ってから自動でやり直す。3回とも失敗したときだけ、失敗として知らせる
      - id: deploy1
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before retry (1)
        if: steps.deploy1.outcome == 'failure'
        run: sleep 30
      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Wait before retry (2)
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 90
      - id: deploy3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v4
