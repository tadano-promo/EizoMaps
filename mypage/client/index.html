<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self' https://www.googletagmanager.com https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://img.youtube.com https://i.ytimg.com https://i.vimeocdn.com https://*.supabase.co https://*.google-analytics.com https://*.googletagmanager.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://vimeo.com https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://www.google.com; frame-src https://www.youtube.com https://player.vimeo.com; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>マイページ（クライアント） — Eizo Maps</title>
<meta name="description" content="依頼した案件・評価・基本情報の管理。">
<meta name="robots" content="noindex, nofollow">
<meta property="og:site_name" content="Eizo Maps">
<meta property="og:title" content="マイページ（クライアント） — Eizo Maps">
<meta property="og:description" content="依頼した案件・評価・基本情報の管理。">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=DM+Mono:wght@400;500&amp;family=Noto+Sans+JP:wght@300;400;500;700&amp;display=swap">
<link rel="stylesheet" href="/assets/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js" integrity="sha384-iLddHTLokph6Omwoyid4XKxHaWa6w41BnoEj0q5oOrzmYPpHIKt1wyjReA7s//pP" crossorigin="anonymous" referrerpolicy="no-referrer" defer></script>
<script src="/assets/js/config.js" defer></script>
<script src="/assets/js/app.js" defer></script>
<script src="/assets/js/page-mypage-client.js" defer></script>
<script src="/assets/js/page-myreviews.js" defer></script>
</head>
<body>
<main class="section">
  <div class="wrap">
    <div class="doc">
      <p class="eyebrow eyebrow--client">Client page</p>
      <h1>クライアントのマイページ</h1>
      <div class="notice" id="pageMsg" hidden></div>

      <div class="form-actions cl-quick">
        <a class="btn btn--primary" href="/creators/">クリエイターを探して依頼する</a>
        <a class="btn" href="/jobs/new.html">募集を出す</a>
        <a class="btn" href="/messages/" id="clMsgBtn">メッセージ</a>
      </div>

      <!-- 評価をまだ書いていない、納品が終わった案件 -->
      <section id="toReviewBox" hidden>
        <h2>評価を書いてください</h2>
        <p class="small muted">納品が終わった案件です。あなたの評価が、次にこのクリエイターに頼む人の手がかりになります。</p>
        <div class="stack" id="toReview"></div>
      </section>

      <section>
        <h2>やりとり中の依頼</h2>
        <div class="stack" id="activeProjects"><p class="small muted">読み込み中…</p></div>
        <p class="small"><a href="/projects/">終わった案件も含めて、すべて見る →</a></p>
      </section>

      <hr class="divider">
      <h2>基本情報</h2>
      <p class="small muted">依頼したクリエイターにだけ見えます。ほかの人には公開しません。</p>
      <form id="clientForm" class="stack" novalidate>
        <label class="field">
          <span class="label">お名前（必須・40文字まで）</span>
          <input type="text" id="clName" maxlength="40" autocomplete="name" placeholder="例：山田 花子">
        </label>
        <label class="field">
          <span class="label">会社名・お店の名前 <span class="muted">（80文字まで・個人の方は空のままで大丈夫です）</span></span>
          <input type="text" id="clCompany" maxlength="80" autocomplete="organization" placeholder="例：株式会社〇〇／〇〇カフェ">
        </label>
        <label class="field">
          <span class="label">地域</span>
          <select id="clArea"><option value="">未設定</option></select>
        </label>
      </form>

      <hr class="divider">
      <h2 id="reviews">評価</h2>
      <div class="notice" id="reviewMsg" hidden></div>
      <div id="myReviews"><p class="small muted">読み込み中…</p></div>

      <hr class="divider">
      <h2>アカウント</h2>
      <label class="field">
        <span class="label">利用種別</span>
        <select id="accountType">
          <option value="creator">クリエイター</option>
          <option value="client">クライアント</option>
          <option value="both">両方</option>
        </select>
      </label>
      <p class="small muted">「両方」にすると、画面の上の帯でクリエイターとクライアントを切り替えられます。</p>
      <div class="form-actions">
        <button class="btn btn--sm btn--danger" type="button" id="logoutBtn">ログアウト</button>
      </div>
    </div>
  </div>
</main>
</body>
</html>
