<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self' https://www.googletagmanager.com https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://img.youtube.com https://i.ytimg.com https://i.vimeocdn.com https://*.supabase.co https://*.google-analytics.com https://*.googletagmanager.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com https://www.google.com; frame-src https://www.youtube.com https://player.vimeo.com; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>ZAPPING — Eizo Maps</title>
<meta name="description" content="映像クリエイターの作品を、テレビのチャンネルを変えるように次々見られるページです。気になった人には、そのまま依頼できます。">
<link rel="canonical" href="https://eizo-maps.com/zapping/">
<meta property="og:site_name" content="Eizo Maps">
<meta property="og:title" content="ZAPPING — Eizo Maps">
<meta property="og:description" content="映像クリエイターの作品を、テレビのチャンネルを変えるように次々見られるページです。">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=DM+Mono:wght@400;500&amp;family=Noto+Sans+JP:wght@300;400;500;700&amp;display=swap">
<link rel="stylesheet" href="/assets/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js" integrity="sha384-iLddHTLokph6Omwoyid4XKxHaWa6w41BnoEj0q5oOrzmYPpHIKt1wyjReA7s//pP" crossorigin="anonymous" referrerpolicy="no-referrer" defer></script>
<script src="/assets/js/config.js" defer></script>
<script src="/assets/js/app.js" defer></script>
<script src="/assets/js/page-zapping.js" defer></script>
</head>
<body class="zap-body" data-no-chrome>
<div class="zap" id="zap">
  <!-- いちばん上：ロゴとホーム（メニューは置かない） -->
  <header class="zap-top">
    <a href="/" class="logo" aria-label="Eizo Maps ホーム"><span>Eizo</span><b>Maps</b></a>
    <span class="zap-top__name">ZAPPING</span>
    <a class="btn btn--sm" href="/">ホーム</a>
  </header>

  <!-- リモコン（ボタンは5個） -->
  <nav class="zap-remote" aria-label="リモコン">
    <button class="zap-btn" type="button" id="zPrev" aria-label="前の作品"><span class="zap-btn__ic" data-ic="prev"></span><span class="zap-btn__lb">前</span></button>
    <button class="zap-btn" type="button" id="zNext" aria-label="次の作品"><span class="zap-btn__ic" data-ic="next"></span><span class="zap-btn__lb">次</span></button>
    <button class="zap-btn" type="button" id="zVolDown" aria-label="音量を下げる"><span class="zap-btn__ic" data-ic="voldown"></span><span class="zap-btn__lb">−</span></button>
    <button class="zap-btn" type="button" id="zVolUp" aria-label="音量を上げる"><span class="zap-btn__ic" data-ic="volup"></span><span class="zap-btn__lb">＋</span></button>
    <button class="zap-btn is-on" type="button" id="zMute" aria-label="ミュートを切り替える" aria-pressed="true"><span class="zap-btn__ic" data-ic="mute"></span><span class="zap-btn__lb">消音</span></button>
  </nav>

  <!-- テレビ -->
  <section class="zap-tv" id="zTv" aria-label="テレビ">
    <div class="zap-tv__bezel zap-tv__bezel--top"></div>
    <div class="zap-screen" id="zScreen">
      <div class="zap-frame" id="zFrame"></div>
      <canvas class="zap-noise" id="zNoise" width="160" height="90" aria-hidden="true"></canvas>
      <div class="zap-osd" id="zOsd" aria-live="polite"></div>
      <div class="zap-vol" id="zVol" aria-hidden="true"></div>
      <!-- 画面をさわる板（動画のサイトの画面ではなく、Eizo Maps のボタンで動かすため） -->
      <button class="zap-touch" type="button" id="zTouch" aria-label="ボタンを出す"></button>
      <button class="zap-play" type="button" id="zPlay" aria-label="再生・停止" hidden><span class="zap-btn__ic" data-ic="pause"></span></button>
      <!-- 全画面のときだけ出す、上の操作 -->
      <div class="zap-fsbar" id="zFsBar" hidden>
        <button class="zap-btn" type="button" data-z="prev" aria-label="前の作品"><span class="zap-btn__ic" data-ic="prev"></span></button>
        <button class="zap-btn" type="button" data-z="next" aria-label="次の作品"><span class="zap-btn__ic" data-ic="next"></span></button>
        <button class="zap-btn" type="button" data-z="voldown" aria-label="音量を下げる"><span class="zap-btn__ic" data-ic="voldown"></span></button>
        <button class="zap-btn" type="button" data-z="volup" aria-label="音量を上げる"><span class="zap-btn__ic" data-ic="volup"></span></button>
        <button class="zap-btn" type="button" data-z="mute" aria-label="ミュートを切り替える"><span class="zap-btn__ic" data-ic="mute"></span></button>
        <button class="zap-btn" type="button" data-z="exit" aria-label="全画面をやめる"><span class="zap-btn__ic" data-ic="exit"></span></button>
      </div>
      <div class="zap-empty" id="zEmpty" hidden></div>
    </div>
    <div class="zap-tv__bezel zap-tv__bezel--bottom">
      <span class="zap-led" id="zLed">CH ---</span>
      <span class="zap-brand">Eizo Maps</span>
      <button class="zap-full" type="button" id="zFull" aria-label="全画面で見る"><span class="zap-btn__ic" data-ic="full"></span><span>全画面</span></button>
    </div>
  </section>

  <!-- いま映っている作品 -->
  <section class="zap-info" id="zInfo" aria-live="polite"></section>
  <p class="zap-note small muted">作品は毎回ばらばらの順番で流れます。音は消した状態で始まるので、聞きたいときは「消音」か「＋」を押してください。流れるのは、クリエイターが公開していて、載せる許可を確認した YouTube・Vimeo の作品です。</p>
</div>
</body>
</html>
