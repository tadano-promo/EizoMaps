<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://img.youtube.com https://i.ytimg.com https://i.vimeocdn.com https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://vimeo.com; frame-src https://www.youtube.com https://player.vimeo.com; upgrade-insecure-requests">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>依頼する — EizoMaps</title>
<meta name="description" content="クリエイターに案件を相談します。">
<meta name="robots" content="noindex, nofollow">
<meta property="og:site_name" content="EizoMaps">
<meta property="og:title" content="依頼する — EizoMaps">
<meta property="og:description" content="クリエイターに案件を相談します。">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&amp;family=DM+Mono:wght@400;500&amp;family=Noto+Sans+JP:wght@300;400;500;700&amp;display=swap">
<link rel="stylesheet" href="/assets/css/style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js" integrity="sha384-iLddHTLokph6Omwoyid4XKxHaWa6w41BnoEj0q5oOrzmYPpHIKt1wyjReA7s//pP" crossorigin="anonymous" referrerpolicy="no-referrer" defer></script>
<script src="/assets/js/config.js" defer></script>
<script src="/assets/js/app.js" defer></script>
<script src="/assets/js/page-request.js" defer></script>
</head>
<body>
<main class="section">
  <div class="wrap doc">
    <p class="eyebrow">Request</p>
    <h1>依頼する</h1>
    <div class="notice" id="pageMsg" hidden></div>

    <div class="card" id="creatorCard" hidden></div>

    <form id="requestForm" class="stack" novalidate hidden>
      <h2>依頼元の情報</h2>
      <p class="small muted">初回のみ入力してください。次回からは自動で入ります。</p>
      <label class="field">
        <span class="label">お名前・担当者名 <span class="muted">（必須）</span></span>
        <input type="text" id="clientName" maxlength="40" required>
      </label>
      <div class="row">
        <label class="field">
          <span class="label">会社名・団体名</span>
          <input type="text" id="clientCompany" maxlength="80">
        </label>
        <label class="field">
          <span class="label">所在地（都道府県）</span>
          <select id="clientArea"><option value="">未設定</option></select>
        </label>
      </div>

      <hr class="divider">
      <h2>案件の内容</h2>
      <label class="field">
        <span class="label">案件タイトル <span class="muted">（必須・100文字まで）</span></span>
        <input type="text" id="title" maxlength="100" required placeholder="例：新商品のブランドムービー制作">
      </label>
      <div class="row">
        <label class="field">
          <span class="label">案件種別</span>
          <select id="kind"></select>
        </label>
        <label class="field">
          <span class="label">予算レンジ</span>
          <select id="budget"></select>
        </label>
      </div>
      <label class="field">
        <span class="label">概要・ご要望 <span class="muted">（4000文字まで）</span></span>
        <textarea id="description" maxlength="4000" rows="8" placeholder="用途、尺、撮影の有無、想定する公開先などを書いていただけると、返信が早くなります。"></textarea>
      </label>
      <div class="row">
        <label class="field">
          <span class="label">希望納期</span>
          <input type="date" id="dueOn">
        </label>
        <label class="field">
          <span class="label">参考URL（https のみ）</span>
          <input type="url" id="referenceUrl" maxlength="500" placeholder="https://">
        </label>
      </div>

      <p class="small muted">送信すると案件として記録され、クリエイターのマイページに表示されます。金額や条件はこのあと案件内のメッセージで詰めてください。</p>
      <div class="form-actions">
        <button class="btn btn--primary" type="submit" id="submitBtn">依頼を送る</button>
        <a class="btn" href="/creators/" id="backLink">戻る</a>
      </div>
    </form>
  </div>
</main>
</body>
</html>
